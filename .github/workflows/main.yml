name: Forex Pro Trading Bot 24x5

on:
  schedule:
    # सोमवार से शुक्रवार हर 6 घंटे में अपने आप चालू होगा (24 घंटे कवरेज)
    - cron: '0 */6 * * 1-5'
  workflow_dispatch:

jobs:
  run-forex-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          pip install yfinance pandas numpy requests

      - name: Run Forex Pro Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: forex_bot.py
